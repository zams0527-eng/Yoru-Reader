name: Build Linux Flatpak

on:
  workflow_dispatch:

jobs:
  build-flatpak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build frontend (skip svelte submodule)
        run: npx vite build

      - name: Install Flatpak tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y flatpak flatpak-builder elfutils
          # Instalar runtimes como USUARIO (no sudo) para que electron-builder los vea
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.electronjs.Electron2.BaseApp//24.08

      - name: Build Flatpak
        run: |
          npx electron-builder --linux flatpak --x64 \
            --config.directories.output=releases/linux
        env:
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: "true"
          DEBUG: "electron-builder,electron-builder:*"

      - name: List output
        if: always()
        run: |
          echo "=== releases/linux ==="
          ls -lh releases/linux/ 2>/dev/null || echo "directorio vacío"
          find releases/linux -name "*.flatpak" 2>/dev/null || echo "sin .flatpak"

      - name: Upload Flatpak
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yoru-reader-linux-flatpak
          path: releases/linux/*.flatpak
          retention-days: 7
