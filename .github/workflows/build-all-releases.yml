name: Build & Publish All Releases

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # 0. OTA HOT UPDATE (dist.zip for fast instant in-app update)
  # -------------------------------------------------------------
  publish-hot-update:
    name: Publish OTA Hot Update (dist.zip)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Get app version
        id: version
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "VERSION=$VER" >> $GITHUB_ENV
          echo "TAG=v$VER" >> $GITHUB_ENV

      - name: Build frontend
        run: npm run build

      - name: Create dist.zip
        run: |
          cd dist
          zip -r ../dist.zip .
          cd ..

      - name: Upload dist.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yoru-Reader-OTA-dist-zip
          path: dist.zip
          retention-days: 14

            - name: Ensure Release Exists & Upload dist.zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Clean up any legacy duplicate release
          gh release delete yorureader --yes --cleanup-tag || true
          cat << 'EOF' > release_body.md
          ## 📥 Descargas Oficiales Multiplataforma (${{ env.TAG }})

          | Plataforma | Paquete | Enlace de descarga |
          | :--- | :--- | :--- |
          | 🪟 **Windows** | Instalador Oficial (.exe) | [⬇️ Descargar Windows Setup (.exe)](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/Yoru-Reader.Setup.${{ env.VERSION }}.exe) |
          | 🍏 **macOS (Apple Silicon)** | Instalador DMG (.dmg) | [⬇️ Descargar macOS (Apple Silicon desde M1 hasta M5 - arm64)](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/Yoru-Reader-${{ env.VERSION }}-arm64.dmg) |
          | 🍏 **macOS (Intel)** | Instalador DMG (.dmg) | [⬇️ Descargar macOS (Intel - x64)](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/Yoru-Reader-${{ env.VERSION }}-x64.dmg) |
          | 🐧 **Linux** | Flatpak (.flatpak) | [⬇️ Descargar Flatpak (x86_64)](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/Yoru-Reader-${{ env.VERSION }}-x86_64.flatpak) |
          | 📱 **Android** | APK (.apk) | [⬇️ Descargar Android APK](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/Yoru-Reader-${{ env.VERSION }}.apk) |
          | ⚡ **Actualización Rápida (OTA)** | Paquete Web (.zip) | [⬇️ Descargar dist.zip](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/dist.zip) |

          ---

          ### 🍏 Guía para usuarios de macOS (Apple Silicon desde M1 hasta M5 e Intel)
          Al descargar el archivo `.dmg`, ábrelo y arrastra el icono de **Yoru Reader** a la carpeta **Aplicaciones**. Si macOS muestra una advertencia de seguridad al abrirla por primera vez:
          1. Abre **Ajustes del Sistema** ➔ **Privacidad y Seguridad**.
          2. Desplázate hacia abajo y haz clic en **"Abrir de todos modos"** (*Open Anyway*).
          EOF

          gh release view "${TAG}" || gh release create "${TAG}" --title "Yoru Reader ${TAG}" --notes-file release_body.md || true
          gh release edit "${TAG}" --notes-file release_body.md || true
                              gh release upload "${TAG}" dist.zip --clobber || true
          
  # -------------------------------------------------------------
  # 1. WINDOWS (.exe NSIS Installer)
  # -------------------------------------------------------------
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Get app version
        id: version
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "VERSION=$VER" >> $GITHUB_ENV
          echo "TAG=v$VER" >> $GITHUB_ENV

      - name: Prepare build assets
        run: |
          node build/prepare-nsis.js

      - name: Build frontend
        run: npm run build

      - name: Package Windows NSIS Installer
        run: |
          npx electron-builder --win nsis --x64 --config.directories.output=dist-electron-installer --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yoru-Reader-Windows-EXE
          path: dist-electron-installer/*.exe
          retention-days: 14

      - name: Ensure Release Exists & Upload EXE
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "dist-electron-installer/Yoru-Reader Setup ${VERSION}.exe" "dist-electron-installer/Yoru-Reader.Setup.${VERSION}.exe" || true
          gh release view "${TAG}" || gh release create "${TAG}" --title "Yoru Reader ${TAG}" --notes "Release ${TAG}" || true
                    gh release upload "${TAG}" dist-electron-installer/*.exe --clobber || true
          
  # -------------------------------------------------------------
  # 2. MACOS (.dmg Apple Silicon arm64 & Intel x64)
  # -------------------------------------------------------------
  build-mac:
    name: Build macOS (.dmg)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Get app version
        id: version
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "VERSION=$VER" >> $GITHUB_ENV
          echo "TAG=v$VER" >> $GITHUB_ENV

      - name: Build frontend
        run: npm run build

      - name: Package DMG (Apple Silicon & Intel)
        run: |
          npx electron-builder --mac dmg --x64 --arm64 \
            --config.directories.output=releases/mac \
            -c.mac.identity=null \
            --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Yoru-Reader-macOS-DMG
          path: releases/mac/*.dmg
          retention-days: 14

      - name: Ensure Release Exists & Upload DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${TAG}" || gh release create "${TAG}" --title "Yoru Reader ${TAG}" --notes "Release ${TAG}" || true
                    gh release upload "${TAG}" releases/mac/*.dmg --clobber || true
          
  # -------------------------------------------------------------
  # 3. ANDROID (.apk)
  # -------------------------------------------------------------
  build-android:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Get app version
        id: version
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "VERSION=$VER" >> $GITHUB_ENV
          echo "TAG=v$VER" >> $GITHUB_ENV

      - name: Build web frontend & sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build Android APK (Release)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Rename and copy APK
        run: |
          mkdir -p releases/android
          cp android/app/build/outputs/apk/release/app-release.apk releases/android/Yoru-Reader-${VERSION}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yoru-Reader-Android-APK
          path: releases/android/Yoru-Reader-${VERSION}.apk
          retention-days: 14

      - name: Ensure Release Exists & Upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${TAG}" || gh release create "${TAG}" --title "Yoru Reader ${TAG}" --notes "Release ${TAG}" || true
                    gh release upload "${TAG}" releases/android/Yoru-Reader-${VERSION}.apk --clobber || true
          
  # -------------------------------------------------------------
  # 4. LINUX (.flatpak)
  # -------------------------------------------------------------
  build-linux:
    name: Build Linux (.flatpak)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Get app version
        id: version
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "VERSION=$VER" >> $GITHUB_ENV
          echo "TAG=v$VER" >> $GITHUB_ENV

      - name: Build frontend
        run: npm run build

      - name: Install Flatpak tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.electronjs.Electron2.BaseApp//24.08

      - name: Package Flatpak
        run: |
          npx electron-builder --linux flatpak --x64 \
            --config.directories.output=releases/linux \
            --publish never

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yoru-Reader-Linux-Flatpak
          path: releases/linux/*.flatpak
          retention-days: 14

      - name: Ensure Release Exists & Upload Flatpak
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${TAG}" || gh release create "${TAG}" --title "Yoru Reader ${TAG}" --notes "Release ${TAG}" || true
                    gh release upload "${TAG}" releases/linux/*.flatpak --clobber || true
          