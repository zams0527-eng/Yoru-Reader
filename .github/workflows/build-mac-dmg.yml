name: Build macOS DMG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build frontend
        run: npx vite build

      - name: Package DMG (Apple Silicon & Intel)
        run: |
          npx electron-builder --mac dmg --x64 --arm64 \
            --config.directories.output=releases/mac \
            -c.mac.identity=null \
            --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List generated DMG files
        run: |
          echo "=== Generated DMG files in releases/mac ==="
          ls -la releases/mac/

      - name: Upload DMG Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Yoru-Reader-macOS-DMG
          path: releases/mac/*.dmg
          retention-days: 14

      - name: Upload DMG to Release
        run: |
          gh release upload yorureader releases/mac/*.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}
